name: AntiDupl CI Build

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches: [ "master" ]

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  
jobs:

  build:
    
    strategy:
      matrix:
        # P3 (documented): NvJpegCollector.vcxproj has Release|x64 only — the
        # .sln maps its Debug/Publish cells to Release. So the Debug matrix cell
        # builds a Debug DLL/GUI but a RELEASE collector (asymmetric artifact
        # set; a Debug collector config would be a project-level change).
        configuration: [Debug, Release, Publish]

    # Windows Server 2022 image = Visual Studio 2022 (v143, VCTargetsPath ...\VC\v170),
    # which is what the projects require. `windows-latest` now ships VS 2026 (v180),
    # where CUDA 12.8's BuildCustomizations do not exist -> the build died with
    # MSB4019 on "CUDA 12.8.props". Pin the image instead of chasing VS 18 support.
    runs-on: windows-2022

    env:
      Solution_Name: ./src/AntiDupl.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Read version.txt
      id: version
      shell: pwsh
      # P3: -Raw + Trim so a future trailing newline/BOM in version.txt can never
      # leak into artifact names via GITHUB_OUTPUT.
      run: echo "content=$([IO.File]::ReadAllText('src/version.txt').Trim())" >> $env:GITHUB_OUTPUT

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Install CUDA 12.8
      # JimVer/cuda-toolkit-action -> Jimver/cuda-toolkit (repo renamed upstream; the old name 404s)
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.8.0'
        method: 'network'
        # Required for matrix builds: the action uploads its install log as an artifact.
        log-file-suffix: '${{ matrix.configuration }}.txt'

    # P3: the former `nuget restore` step is gone — the C++ projects have no NuGet
    # dependencies. The C# ones still need a restore: plain `msbuild` does not
    # restore PackageReference projects (a fresh checkout has no obj/project.assets.json),
    # so the solution build below passes /restore.

    - name: Run and cache vcpkg dependecies
      uses: lukka/run-vcpkg@v10.7
      with:
        # 501db0f (2023) can no longer build ports from source on a fresh runner: its
        # tool URLs rotted (7-Zip 21.07 -> 404) and its msys2 acquisition pulls i686
        # packages that msys2 has deleted. 4acadb7 is the vcpkg used locally, where the
        # same manifest installs and the solution builds.
        vcpkgGitCommitId: 4acadb7d732e662bbf130c4849be6d3a0aa6f6b9
        vcpkgJsonGlob: src/vcpkg.json
        runVcpkgInstall: false

    # The manifest install tree is the expensive part (~60 min of port builds from
    # source: libheif/libavif/libjxl pull aom/x265/...). Debug, Release and Publish
    # use the same triplet, so one key is shared by all three jobs. The first run
    # after a vcpkg.json change is cold; later runs restore in seconds.
    - name: Cache vcpkg install tree
      uses: actions/cache@v4
      with:
        path: src/vcpkg_installed
        key: vcpkg-installed-4acadb7-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}

    # `vcpkg integrate install` writes vcpkg.system.props into "Program Files" and dies
    # with Access Denied on hosted runners, so the build got no vcpkg include paths.
    # Import the same two files through Microsoft.Cpp.props' ForceImportBeforeCppProps
    # hook instead (works without elevation, and identical to what the integration
    # does). VcpkgInstalledDir stays default: manifest mode installs into
    # <manifest root>\vcpkg_installed\<triplet>\<triplet>, which is the path the targets
    # compute - overriding it breaks openjpeg/Simd includes.
    - name: Set up vcpkg MSBuild integration
      shell: pwsh
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        $vcpkg = $env:VCPKG_ROOT
        $force = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-force.props'
        @"
        <Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
          <Import Condition="Exists('$vcpkg\scripts\buildsystems\msbuild\vcpkg.props')" Project="$vcpkg\scripts\buildsystems\msbuild\vcpkg.props" />
          <Import Condition="Exists('$vcpkg\scripts\buildsystems\msbuild\vcpkg.targets')" Project="$vcpkg\scripts\buildsystems\msbuild\vcpkg.targets" />
        </Project>
        "@ | Set-Content -Path $force -Encoding UTF8
        Get-Content $force

    # A fresh checkout has no install tree, and the MSBuild manifest install is hooked
    # BeforeTargets="ClCompile" while the CUDA BuildCustomizations compile the .cu files
    # (which include Simd) earlier -> the build died with
    # "adSimd.h(28): fatal error C1083: Cannot open include file: 'Simd/SimdLib.hpp'".
    # Install the manifest up front, with the same command vcpkg.targets runs.
    - name: Install vcpkg manifest dependencies
      shell: pwsh
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        $root = $env:VCPKG_ROOT
        $triplet = $env:VCPKG_DEFAULT_TRIPLET
        $manifest = Join-Path $env:GITHUB_WORKSPACE 'src'
        # vcpkg appends the triplet to --x-install-root (verified 2026-10-19), so the
        # tree lands in <manifest>\vcpkg_installed\<triplet>\<triplet> - the directory
        # the targets consume as _ZVcpkgCurrentInstalledDir.
        $installRoot = Join-Path $manifest "vcpkg_installed\$triplet"
        $header = Join-Path $installRoot "$triplet\include\Simd\SimdLib.hpp"
        if (Test-Path $header) {
            Write-Host "vcpkg install tree restored from cache: $header"
            exit 0
        }
        & "$root\vcpkg.exe" install --x-wait-for-lock --clean-after-build --triplet $triplet --vcpkg-root "$root\" "--x-manifest-root=$manifest\" "--x-install-root=$installRoot\"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed (exit $LASTEXITCODE)" }
        if (-not (Test-Path $header)) { throw "vcpkg install did not produce $header" }
        Write-Host "vcpkg install tree ready: $header"

    - if: matrix.configuration == 'Release' || matrix.configuration == 'Debug'
      name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /restore /p:Configuration=$env:Configuration /p:Platform=x64 /p:ForceImportBeforeCppProps=${{ github.workspace }}\vcpkg-force.props $env:Solution_Name
      env: 
        Configuration: ${{ matrix.configuration }}

    - if: matrix.configuration == 'Publish'
      name: Build native (Publish)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # manifest install stays enabled: this cell is a fresh checkout, nothing is
      # installed under src\vcpkg_installed yet (locally Deploy.cmd passes
      # /p:VcpkgManifestInstall=false because the ports are already there).
      run: msbuild /m src\AntiDupl\AntiDupl.vcxproj /p:Configuration=$env:Configuration /p:Platform=x64 /p:ForceImportBeforeCppProps=${{ github.workspace }}\vcpkg-force.props
      env:
        Configuration: ${{ matrix.configuration }}

    - if: matrix.configuration == 'Publish'
      name: Publish WinForms (SingleFile)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet publish src\AntiDupl.NET.WinForms\AntiDupl.NET.WinForms.csproj -c Publish -p:PublishProfile=AntiDuplPublishSingleFile -p:SolutionDir="src\\"
      env:
        Configuration: ${{ matrix.configuration }}
        
    - if: matrix.configuration == 'Release'
      name: Run contract tests (P2-13)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet run --project tests\AntiDupl.Contract.Tests\AntiDupl.Contract.Tests.csproj

    # Deploy.cmd stages the CUDA runtime into bin/Release locally; CI has no Deploy
    # step, and a package without those DLLs starts but cannot do "New Database".
    # The collector links nvjpeg via $(CUDA_PATH) (12.8 here), AntiDupl.dll links cudart 12.8.
    - if: matrix.configuration == 'Release'
      name: Stage CUDA runtime DLLs (Release)
      shell: pwsh
      run: |
        $bin = Join-Path $env:GITHUB_WORKSPACE 'bin\Release'
        # CUDA 12.x keeps the runtime DLLs in bin\, CUDA 13.x in bin\x64\.
        foreach ($name in @('nvjpeg64_12.dll', 'cudart64_12.dll')) {
          $source = @((Join-Path $env:CUDA_PATH "bin\x64\$name"), (Join-Path $env:CUDA_PATH "bin\$name")) |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $source) { throw "$name not found under $env:CUDA_PATH" }
          Copy-Item $source $bin -Force
        }
        Get-ChildItem $bin -Filter '*64_*.dll' | Select-Object -ExpandProperty Name

    - if: matrix.configuration == 'Release'
      name: Make release binary and source files
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cd cmd
        .\MakeBin.cmd

    - if: matrix.configuration == 'Release'
      name: Verify Release package (CUDA runtime)
      shell: pwsh
      # Same fail-early idea as the Publish check below: a zip without the CUDA
      # runtime ships a GUI that cannot run the collector.
      run: |
        $version = [IO.File]::ReadAllText('src/version.txt').Trim()
        $zip = "out\bin\AntiDupl.NET-$version.zip"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
        $missing = @()
        foreach ($f in @('AntiDupl.dll', 'cudart64_12.dll', 'NvJpegCollector.exe')) {
          if (-not ($names -contains $f)) { $missing += $f }
        }
        if (-not ($names | Where-Object { $_ -like 'nvjpeg64_*.dll' })) { $missing += 'nvjpeg64_*.dll' }
        if ($missing.Count -gt 0) { Write-Host "Missing in $zip : $($missing -join ', ')"; exit 1 }
        $cuda = $names | Where-Object { $_ -like '*64_*.dll' }
        Write-Host "Release package verified: $($cuda -join ', ') + NvJpegCollector.exe"
      
    - if: matrix.configuration == 'Publish'
      name: Make release binary and source files
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cd cmd
        .\MakePublish.cmd

    # P2-14: dotnet publish does not copy native P/Invoke DLLs — if the copy
    # step above breaks or misses a dependency, the package would ship without
    # them and fail at startup ("Can't load AntiDupl.dll"). Fail the build early
    # instead of letting a broken package reach the artifact store.
      # The package now ships the collector too: a portable first run must be able
      # to build a database without a .NET install.
    - if: matrix.configuration == 'Publish'
      name: Verify native DLLs in Publish output (P2-14)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: pwsh
      run: |
        # P3: trimmed read — see the version step note.
        $version = [IO.File]::ReadAllText('src/version.txt').Trim()
        $pkgDir = "out\Publish\AntiDupl.NET-$version"
        $required = @('AntiDupl.dll', 'cudart64_12.dll', 'NvJpegCollector.exe')
        $missing = @()
        foreach ($f in $required) {
          if (-not (Test-Path (Join-Path $pkgDir $f))) { $missing += $f }
        }
        if (-not (Get-ChildItem $pkgDir -Filter 'nvjpeg64_*.dll' -ErrorAction SilentlyContinue)) {
          $missing += 'nvjpeg64_*.dll'
        }
        if ($missing.Count -gt 0) {
          Write-Host "Missing native DLLs in $pkgDir : $($missing -join ', ')"
          exit 1
        }
        Write-Host "Native DLLs verified: $($required -join ', ')"
      
    - if: matrix.configuration == 'Release'
      name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: "AntiDupl.NET-${{ steps.version.outputs.content }} build"
        path: |
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.exe
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.exe.hash.txt
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.zip
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.zip.hash.txt

    - if: matrix.configuration == 'Publish'
      name: Upload build SingleFilePortable
      uses: actions/upload-artifact@v4
      with:
        name: "AntiDupl.NET-${{ steps.version.outputs.content }} build SingleFilePortable"
        path: |
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe.hash.txt
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip.hash.txt
    
  create-draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    # Same VS 2022 requirement as the build job (CUDA 12.8 BuildCustomizations).
    runs-on: windows-2022

    env:
      # Пустой секрет (VT_API_KEY не задан) -> шаг VirusTotal пропускается,
      # релиз создаётся без отчёта. Добавьте секрет - скан включится сам.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    
    steps:
      - uses: msys2/setup-msys2@v2
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version.txt
        id: version
        shell: pwsh
        # P3: trimmed read — see the build job note.
        run: echo "content=$([IO.File]::ReadAllText('src/version.txt').Trim())" >> $env:GITHUB_OUTPUT

      - name: Load all artifacts
        uses: actions/download-artifact@v4
        with:
          name: "AntiDupl.NET-${{ steps.version.outputs.content }} build"

      - name: Load all artifacts
        uses: actions/download-artifact@v4
        with:
          name: "AntiDupl.NET-${{ steps.version.outputs.content }} build SingleFilePortable"
          
      - name: Virus Total Scan
        id: scan_files
        if: ${{ env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v3
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            AntiDupl.NET-${{ steps.version.outputs.content }}.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}.zip
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip
            
      - name: Generate release body
        shell: msys2 {0}
        run: |
          : > body.txt
          analysis="${{ steps.scan_files.outputs.analysis }}"
          if [ -n "$analysis" ]; then
            echo "🛡 [VirusTotal GitHub Action](https://github.com/crazy-max/ghaction-virustotal) analysis:" >> body.txt
            echo "" >> body.txt
            while read -d, -r pair; do
              IFS='=' read -r filename analysisURL <<<"$pair"
              echo "* [$(basename $filename)]($analysisURL)" >> body.txt
            done <<<"$analysis,"
          fi
        
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AntiDupl.NET v${{ steps.version.outputs.content }}"
          body_path: body.txt
          prerelease: true
          files: |
            AntiDupl.NET-${{ steps.version.outputs.content }}.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}.exe.hash.txt
            AntiDupl.NET-${{ steps.version.outputs.content }}.zip
            AntiDupl.NET-${{ steps.version.outputs.content }}.zip.hash.txt
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe.hash.txt
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip.hash.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
