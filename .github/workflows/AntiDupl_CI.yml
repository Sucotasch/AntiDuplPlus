name: AntiDupl CI Build

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches: [ "master" ]

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  
jobs:

  build:
    
    strategy:
      matrix:
        # P3 (documented): NvJpegCollector.vcxproj has Release|x64 only — the
        # .sln maps its Debug/Publish cells to Release. So the Debug matrix cell
        # builds a Debug DLL/GUI but a RELEASE collector (asymmetric artifact
        # set; a Debug collector config would be a project-level change).
        configuration: [Debug, Release, Publish]

    runs-on: windows-latest

    env:
      Solution_Name: ./src/AntiDupl.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Read version.txt
      id: version
      shell: pwsh
      # P3: -Raw + Trim so a future trailing newline/BOM in version.txt can never
      # leak into artifact names via GITHUB_OUTPUT.
      run: echo "content=$([IO.File]::ReadAllText('src/version.txt').Trim())" >> $env:GITHUB_OUTPUT

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Install CUDA 12.8
      uses: JimVer/cuda-toolkit-action@v0.2
      with:
        cuda: '12.8.0'
        method: 'network'

    # P3: the former `nuget restore` step was dead weight — all C# projects are
    # PackageReference-based net8.0 csproj restored by msbuild/dotnet themselves,
    # and the C++ projects have no NuGet dependencies. It succeeded trivially and
    # wasted ~30s per matrix cell.

    - name: Run and cache vcpkg dependecies
      uses: lukka/run-vcpkg@v10.7
      with:
        vcpkgGitCommitId: 501db0f17ef6df184fcdbfbe0f87cde2313b6ab1
        vcpkgJsonGlob: src/vcpkg.json
        runVcpkgInstall: false
        appendedCacheKey: '${{matrix.configuration}}'

    - name: Integrate vcpkg
      working-directory: ${{env.VCPKG_ROOT}}
      run: |
        ${{ github.workspace }}/vcpkg/vcpkg.exe integrate install

    - if: matrix.configuration == 'Release' || matrix.configuration == 'Debug'
      name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=$env:Configuration /p:Platform=x64 $env:Solution_Name
      env: 
        Configuration: ${{ matrix.configuration }}

    - if: matrix.configuration == 'Publish'
      name: Build native (Publish)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m src\AntiDupl\AntiDupl.vcxproj /p:Configuration=$env:Configuration /p:Platform=x64 /p:VcpkgManifestInstall=false
      env:
        Configuration: ${{ matrix.configuration }}

    - if: matrix.configuration == 'Publish'
      name: Publish WinForms (SingleFile)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet publish src\AntiDupl.NET.WinForms\AntiDupl.NET.WinForms.csproj -c Publish -p:PublishProfile=AntiDuplPublishSingleFile -p:SolutionDir="src\\"
      env:
        Configuration: ${{ matrix.configuration }}
        
    - if: matrix.configuration == 'Release'
      name: Run contract tests (P2-13)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet run --project tests\AntiDupl.Contract.Tests\AntiDupl.Contract.Tests.csproj

    - if: matrix.configuration == 'Release'
      name: Make release binary and source files
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cd cmd
        .\MakeBin.cmd
      
    - if: matrix.configuration == 'Publish'
      name: Make release binary and source files
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cd cmd
        .\MakePublish.cmd

    # P2-14: dotnet publish does not copy native P/Invoke DLLs — if the copy
    # step above breaks or misses a dependency, the package would ship without
    # them and fail at startup ("Can't load AntiDupl.dll"). Fail the build early
    # instead of letting a broken package reach the artifact store.
    # Note: the Publish package contains the GUI only (no NvJpegCollector.exe,
    # no nvjpeg64_13.dll — those live in the full bin package).
    - if: matrix.configuration == 'Publish'
      name: Verify native DLLs in Publish output (P2-14)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: pwsh
      run: |
        # P3: trimmed read — see the version step note.
        $version = [IO.File]::ReadAllText('src/version.txt').Trim()
        $pkgDir = "out\Publish\AntiDupl.NET-$version"
        $required = @('AntiDupl.dll', 'cudart64_12.dll')
        $missing = @()
        foreach ($f in $required) {
          if (-not (Test-Path (Join-Path $pkgDir $f))) { $missing += $f }
        }
        if ($missing.Count -gt 0) {
          Write-Host "Missing native DLLs in $pkgDir : $($missing -join ', ')"
          exit 1
        }
        Write-Host "Native DLLs verified: $($required -join ', ')"
      
    - if: matrix.configuration == 'Release'
      name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: "AntiDupl.NET-${{ steps.version.outputs.content }} build"
        path: |
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.exe
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.exe.hash.txt
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.zip
              ${{ github.workspace }}\out\bin\AntiDupl.NET-${{ steps.version.outputs.content }}.zip.hash.txt

    - if: matrix.configuration == 'Publish'
      name: Upload build SingleFilePortable
      uses: actions/upload-artifact@v4
      with:
        name: "AntiDupl.NET-${{ steps.version.outputs.content }} build SingleFilePortable"
        path: |
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe.hash.txt
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip
              ${{ github.workspace }}\out\Publish\AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip.hash.txt
    
  create-draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    
    runs-on: windows-latest
    
    steps:
      - uses: msys2/setup-msys2@v2
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version.txt
        id: version
        shell: pwsh
        # P3: trimmed read — see the build job note.
        run: echo "content=$([IO.File]::ReadAllText('src/version.txt').Trim())" >> $env:GITHUB_OUTPUT

      - name: Load all artifacts
        uses: actions/download-artifact@v4
        with:
          name: "AntiDupl.NET-${{ steps.version.outputs.content }} build"

      - name: Load all artifacts
        uses: actions/download-artifact@v4
        with:
          name: "AntiDupl.NET-${{ steps.version.outputs.content }} build SingleFilePortable"
          
      - name: Virus Total Scan
        id: scan_files
        uses: crazy-max/ghaction-virustotal@v3
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            AntiDupl.NET-${{ steps.version.outputs.content }}.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}.zip
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip
            
      - name: Generate VirusTotal Body
        shell: msys2 {0}
        run: |
          echo "🛡 [VirusTotal GitHub Action](https://github.com/crazy-max/ghaction-virustotal) analysis:" >> body.txt
          echo "" >> body.txt
          analysis="${{ steps.scan_files.outputs.analysis }}"
          while read -d, -r pair; do
            IFS='=' read -r filename analysisURL <<<"$pair"
            echo "* [$(basename $filename)]($analysisURL)" >> body.txt
          done <<<"$analysis,"
        
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AntiDupl.NET v${{ steps.version.outputs.content }}"
          body_path: body.txt
          prerelease: true
          files: |
            AntiDupl.NET-${{ steps.version.outputs.content }}.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}.exe.hash.txt
            AntiDupl.NET-${{ steps.version.outputs.content }}.zip
            AntiDupl.NET-${{ steps.version.outputs.content }}.zip.hash.txt
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe.hash.txt
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip
            AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip.hash.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
